name: android
# Builds the APK, installs it on an x86_64 emulator, drives the real app and uploads screenshots.
# Tag `android-vX.Y.Z` -> GitHub Release with the APK and checksums.
on:
  push:
    branches: [main, feat/android]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then V="${GITHUB_REF_NAME#android-v}"; else V="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace -PlxVersionName="${{ steps.v.outputs.name }}" -PlxVersionCode="${GITHUB_RUN_NUMBER}"
      - name: Package + checksums
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Luminos-Android-${{ steps.v.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt && ls -l)
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: dist/* }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator end-to-end (install, open, onboarding, engine boot, screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash android/ci/emulator_test.sh android/app/build/outputs/apk/release/app-release.apk android/ci/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-screenshots, path: android/ci/shots/*.png }

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          name: Luminos Mobile ${{ github.ref_name }}
          body_path: docs/android/RELEASE_NOTES.md
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
