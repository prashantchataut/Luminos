name: CI
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release -p luminos-app
      - name: Render screenshots
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p luminos-app --release --bin luminos-shots -- ../docs/screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: screenshots
          path: docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: luminos-${{ matrix.os }}
          path: |
            launcher/target/release/luminos
            launcher/target/release/luminos.exe
          if-no-files-found: ignore

  live-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - run: cargo test -p luminos-core --test live -- --ignored --test-threads=1
      # A1g: real requests through the audited HTTP layer; fails if any contacted host (redirects
      # included) is not in the registry.
      - run: cargo test -p luminos-core --test network_audit_live -- --ignored --nocapture --test-threads=1

  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: A5c - hosts.json must match the registry (privacy page cannot drift)
        working-directory: launcher
        run: |
          cargo run -q -p luminos-core --example hosts_json > /tmp/hosts.json
          diff -u ../site/src/lib/hosts.json /tmp/hosts.json
      - name: B2 - icon set tests (size, palette, uniqueness, determinism)
        run: |
          python3 tools/test_icons.py
          git diff --exit-code brand/icons
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Site type-check and build (renders /privacy from hosts.json)
        working-directory: site
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
