name: Title-screen smoke (Fabric must accept the default preset)
# Launches the default Luminos Client preset to the Minecraft title screen with the real engine
# (dependency solver + offline skin server) under software OpenGL, on 26.3 and the latest 1.21.x.
# Fails the build if Fabric reports any incompatibility or the title screen is never reached.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  client-jars:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.3", dir: client26 }
          - { mc: "1.21.11", dir: client }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: ${{ matrix.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-jar-${{ matrix.mc }}
          path: ${{ matrix.dir }}/build/libs/luminos-client-*-mc${{ matrix.mc }}.jar

  smoke:
    needs: client-jars
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "1.21.11"]
        variant: [full]   # minimal / no-skin / no-render exist in the harness (LUMINOS_SMOKE_VARIANT) for bisecting a failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the real default preset ("full") gates the build; the other variants exist to bisect a failure.
    continue-on-error: ${{ matrix.variant != 'full' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: launcher }
      - uses: actions/download-artifact@v4
        with:
          name: smoke-jar-${{ matrix.mc }}
          path: jar
      - name: System libraries (software GL + X)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 libpulse0 imagemagick x11-utils mesa-vulkan-drivers
      - name: Build the smoke harness
        timeout-minutes: 20
        working-directory: launcher
        run: cargo build -p luminos-core --example smoke --release
      - name: Launch to the title screen
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_VK_WSI_PRESENT_MODE: immediate
          vblank_mode: "0"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          LUMINOS_CLIENT_JAR_DIR: ${{ github.workspace }}/jar
          LUMINOS_SMOKE_VARIANT: ${{ matrix.variant }}
          LUMINOS_SMOKE_ACK_DIR: ${{ github.workspace }}/out
        run: |
          set -o pipefail   # without this the harness exit code was swallowed by `tee` (the gate was always green)
          export LUMINOS_CLIENT_JAR="$(ls $GITHUB_WORKSPACE/jar/luminos-client-*-mc${{ matrix.mc }}.jar | head -1)"
          mkdir -p out
          # Start X ourselves with access control off. `xvfb-run` hides the display behind an Xauthority cookie, so the
          # separate `import` process below could never connect and the old capture failed silently (stderr went to /dev/null).
          Xvfb :99 -ac -screen 0 1920x1080x24 +extension GLX +render -noreset > out/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99
          : > out/run.log; : > out/capture.log
          # one capture per marker the client logs: cover = vanilla panorama (per-version cover art), title = Luminos title
          # screen, panel / panel-hud = the quick panel. Errors are kept in out/capture.log.
          ( for shot in $(cat scripts/client-shots.txt); do
              if timeout 900 bash -c "until grep -q '\[luminos\] shot $shot\$' out/run.log; do sleep 0.5; done"; then
                sleep 8   # llvmpipe renders a frame every few seconds; the client holds the scene still until we ack
                import -display :99 -window root "out/$shot-${{ matrix.mc }}.png" 2>> out/capture.log && echo "captured $shot" >> out/capture.log || echo "capture $shot FAILED" >> out/capture.log
                touch "out/ack-$shot"   # tells the client the frame is saved, so it can move on to the next scene
              else echo "marker $shot never appeared" >> out/capture.log; fi
            done ) &
          launcher/target/release/examples/smoke ${{ matrix.mc }} out 2>&1 | tee out/run.log
          sleep 2; cat out/capture.log
      - name: Summary
        if: always()
        run: |
          cat out/result.json || true
          echo '### Smoke ${{ matrix.mc }} / ${{ matrix.variant }}' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY; cat out/result.json >> $GITHUB_STEP_SUMMARY || true; echo '```' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY; cat out/mod-report.json >> $GITHUB_STEP_SUMMARY || true; echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.mc }}-${{ matrix.variant }}
          path: out
