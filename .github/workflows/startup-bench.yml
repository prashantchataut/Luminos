name: Startup benchmark (Sodium-only vs Luminos profile, same runner)
# Measures time from process spawn to "resources ready" (the vanilla GUI-atlas log line, present in every variant) for a
# Sodium-only Fabric instance and for the full Luminos profile, alternating, three runs each, on one GitHub-hosted runner.
# GitHub runners have no GPU (llvmpipe) and 2 vCPUs: this measures loading work, not rendering. See docs/PERF.md.
on:
  workflow_dispatch:
  pull_request:
    paths: ["launcher/crates/luminos-core/examples/smoke.rs", ".github/workflows/startup-bench.yml"]

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: bench-jar
          path: client/build/libs/luminos-client-*-mc1.21.11.jar

  bench:
    needs: jar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: launcher }
      - uses: actions/download-artifact@v4
        with:
          name: bench-jar
          path: jar
      - name: System libraries (software GL + X)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 libpulse0 x11-utils mesa-vulkan-drivers
      - name: Build the harness
        working-directory: launcher
        run: cargo build -p luminos-core --example smoke --release
      - name: Run 3 x (Sodium-only, Luminos profile), alternating
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          vblank_mode: "0"
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
          LUMINOS_CLIENT_JAR_DIR: ${{ github.workspace }}/jar
          LUMINOS_STARTUP_ONLY: "1"
        run: |
          export LUMINOS_CLIENT_JAR="$(ls $GITHUB_WORKSPACE/jar/luminos-client-*-mc1.21.11.jar | head -1)"
          Xvfb :99 -ac -screen 0 1920x1080x24 +extension GLX +render -noreset > xvfb.log 2>&1 &
          sleep 2; export DISPLAY=:99
          mkdir -p bench
          for i in 1 2 3; do
            for v in sodium-only full; do
              LUMINOS_SMOKE_VARIANT=$v launcher/target/release/examples/smoke 1.21.11 bench/$v-$i > bench/$v-$i.log 2>&1 || true
              echo "run $i $v: $(cat bench/$v-$i/result.json 2>/dev/null | tr -d '\n ' | cut -c1-300)"
            done
          done
      - name: Table
        if: always()
        run: |
          cat > table.py <<'PY'
          import json, glob, statistics as st
          rows = {}
          for f in sorted(glob.glob('bench/*-[0-9]/result.json')):
              d = json.load(open(f)); rows.setdefault(d['variant'], []).append(d)
          print('| variant | mods | runs | resources-ready s (each run) | median s |')
          print('|---|---|---|---|---|')
          med = {}
          for v, rs in rows.items():
              xs = [r.get('gui_atlas_seconds') for r in rs if r.get('gui_atlas_seconds')]
              med[v] = st.median(xs) if xs else None
              if xs: print(f"| {v} | {rs[0].get('mods')} | {len(rs)} | {', '.join(f'{x:.1f}' for x in xs)} | {med[v]:.1f} |")
              else: print(f"| {v} | - | {len(rs)} | no marker seen | - |")
          if med.get('sodium-only') and med.get('full'):
              print(f"\nLuminos profile / Sodium-only = {med['full']/med['sodium-only']:.2f}x (target in the brief: <= 0.60x)")
          PY
          python3 table.py | tee bench/startup-table.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-bench
          path: bench
