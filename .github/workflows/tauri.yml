name: Tauri crate + engine (compiles on Windows and Linux)
# The desktop shell had never been compiled in CI on its own; this makes "does the Tauri crate build" the first thing that can fail.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "launcher\napp/src-tauri" }
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev libxdo-dev
      - name: Engine tests (agent hub, live classification, pending queue, shares, p2p bridge, dedup)
        working-directory: launcher
        run: cargo test -p luminos-core --lib -- livemod pending agent shares p2p dedup
      - name: Front end builds (the Tauri build embeds app/dist)
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: Compile the Tauri crate and its command tests
        working-directory: app/src-tauri
        run: |
          cargo check --locked
          cargo test --lib
