name: Theme regression
# The same screens in Default, Lunar and Light, side by side, on every PR that touches the app. The job FAILS if the layout
# (positions and sizes of every landmark) differs between themes: a theme may change colours only.
on:
  pull_request:
    paths: ["app/src/**", "app/tools/**", ".github/workflows/themes.yml"]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm test && npm run build
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: |
          npx vite preview --port 4173 &
          sleep 3
          OUT=../theme-regression node tools/theme-regression.mjs
          OUT=../skin3d node tools/skin3d-check.mjs
          node tools/livepanel.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: theme-regression, path: theme-regression }
