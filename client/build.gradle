plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// shared/ is identical on every Minecraft line (config, modules, HUD logic); legacy/ is the 1.21.x adapter.
// client26/ builds the same shared code for Minecraft 26.x with its own adapter.
sourceSets {
	main {
		java.srcDirs = ['src/shared/java', 'src/legacy/java']
		resources.srcDirs = ['src/main/resources', 'src/legacy/resources']
	}
}

loom {
	accessWidenerPath = file('src/main/resources/luminos.accesswidener')
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "minecraft_range", project.minecraft_range
	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version, "minecraft_range": project.minecraft_range, "java_min": "21"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}

// Offscreen preview of the in-game screens (docs/design/rounds/ingame-*.png): `./gradlew renderPreview -PpreviewOut=<dir>`.
// Runs the real TitleScene / ModPanelView layout code through a Java2D Gfx. Not part of the shipped jar.
sourceSets {
	preview {
		java.srcDirs = ['src/preview/java']
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}
tasks.register('renderPreview', JavaExec) {
	dependsOn classes, 'previewClasses'
	classpath = sourceSets.preview.output + sourceSets.preview.runtimeClasspath
	mainClass = 'dev.luminos.client.preview.PreviewMain'
	systemProperty 'java.awt.headless', 'true'
	args(project.findProperty('previewOut') ?: "${buildDir}/preview")
}

// Headless hit-test of the v4.4 screens: renders the real views, clicks the rectangles they registered, exits 1 on any failure.
tasks.register('hitTest', JavaExec) {
	dependsOn classes, 'previewClasses'
	classpath = sourceSets.preview.output + sourceSets.preview.runtimeClasspath
	mainClass = 'dev.luminos.client.HitTestMain'
	systemProperty 'java.awt.headless', 'true'
	args(project.findProperty('hitOut') ?: "${buildDir}/hit-test.txt")
}

// Headless input + render tests: drive the REAL ModPanelView / MainMenuView / HudEditor (the code the in-game screens delegate to) through
// the Java2D Gfx, assert clicks/keys/scrolls, and write 2560x1600 PNGs.  ./gradlew testAndRenderScreens -Pround=1 -PrendersDir=<dir>
sourceSets {
	test {
		java.srcDirs = ['src/test/java']
		compileClasspath += sourceSets.preview.output
		runtimeClasspath += sourceSets.preview.output
	}
}
test {
	useJUnitPlatform()
	dependsOn 'previewClasses'
	maxHeapSize = '700m'
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'luminos.rounds.dir', (project.findProperty('rendersDir') ?: "${buildDir}/renders").toString()
	systemProperty 'luminos.round', (project.findProperty('round') ?: '1').toString()
	systemProperty 'luminos.src.dir', projectDir.absolutePath
	testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}
tasks.register('testAndRenderScreens') { dependsOn 'test' }
