plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Shared code lives in ../client; files that must differ for the unobfuscated API live in src/main.
sourceSets {
	main {
		java.srcDirs = ['src/main/java', '../client/src/shared/java']
		resources.srcDirs = ['src/main/resources', '../client/src/main/resources']
	}
}

loom {
	accessWidenerPath = file('src/main/resources/luminos26.accesswidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "minecraft_range", project.minecraft_range
	inputs.property "java_min", "25"
	exclude "luminos.accesswidener"   // the 1.21 file uses the named namespace; this line uses luminos26.accesswidener (official)
	filesMatching("fabric.mod.json") {
		filter { it.replace("luminos.accesswidener", "luminos26.accesswidener") }
		expand "version": project.mod_version, "minecraft_range": project.minecraft_range, "java_min": "25"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("../client/LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
