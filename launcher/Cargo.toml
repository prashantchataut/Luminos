[workspace]
resolver = "2"
members = ["crates/luminos-core", "crates/luminos-app"]

[workspace.package]
publish = false
version = "0.3.0"
edition = "2021"
license = "LicenseRef-Luminos-Proprietary"


[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile tuned for a tiny, fast launcher binary.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# Dev builds: keep dependencies optimised so the UI stays smooth while iterating.
[profile.dev.package."*"]
opt-level = 2
