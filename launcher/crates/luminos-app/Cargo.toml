[package]
name = "luminos-app"
description = "Luminos Launcher desktop UI (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "luminos"

[[bin]]
name = "luminos"
path = "src/main.rs"

[[bin]]
name = "luminos-shots"
path = "src/bin/shots.rs"

[dependencies]
luminos-core = { path = "../luminos-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
