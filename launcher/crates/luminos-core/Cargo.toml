[package]
name = "luminos-core"
description = "Headless engine of Luminos Launcher: instances, downloads, launching, mods, playtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reflink-copy = "0.1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
sha1 = "0.11"
md5 = "0.8"
dirs = "7"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
luminos-auth = { path = "../luminos-auth" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

# OS secure store for account tokens (Windows Credential Manager, macOS Keychain, Linux kernel keyring).
# Nothing else may hold a token; see src/secrets.rs.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }
